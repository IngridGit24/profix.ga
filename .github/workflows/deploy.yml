# CI/CD pour le monorepo ProFixGabon (backend/ + frontend/).
#
# État actuel — 2 étapes : analyse (lint + build) puis build & push des
# images Docker (déjà prêtes, distroless — voir backend/Dockerfile et
# frontend/Dockerfile). Le déploiement effectif sur le VPS de prod n'est
# PAS encore câblé ici : ce sera une 3e étape ajoutée une fois le serveur
# prêt, sur le même schéma que moncv.ga (SSH, régénération de
# .env/docker-compose.yml depuis les secrets GitHub, `docker compose pull
# && up -d`) — voir son .github/workflows/deploy.yml pour le patron
# complet le moment venu.
#
# Le frontend a par ailleurs sa propre preview automatique sur Vercel,
# connectée directement depuis leur dashboard (pas pilotée par ce
# workflow) — c'est pour montrer une v0 rapidement, pas la prod.
#
# Registre : Docker Hub, compte "ingridcode" (même compte que moncv.ga).
#
# Secrets GitHub requis (Settings → Secrets and variables → Actions →
# Secrets — PAS Variables : DOCKER_PASSWORD est un identifiant, il doit
# être chiffré et masqué des logs, ce que seuls les Secrets font) :
#   DOCKER_USERNAME → compte Docker Hub (ingridcode)
#   DOCKER_PASSWORD → mot de passe ou access token Docker Hub
#
# Variable GitHub optionnelle (Settings → Secrets and variables → Actions
# → Variables, PAS Secrets — non sensible) :
#   VITE_API_BASE_URL → URL de l'API backend à inliner dans le build
#                        frontend (ex: https://api.profixgabon.ga/api/v1).
#                        Vite l'inline au build, jamais au runtime — voir
#                        frontend/README.md. Sans elle, un placeholder
#                        évident est utilisé (à corriger dès que le
#                        backend a une vraie adresse publique).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  BACKEND_IMAGE_NAME: ingridcode/profixgabon-backend
  FRONTEND_IMAGE_NAME: ingridcode/profixgabon-frontend
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.profixgabon.example.com/api/v1' }}

jobs:
  # ── 1a. Analyse — backend ────────────────────────────────────────────
  analyze-backend:
    name: "1. Analyse — backend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        working-directory: backend
        run: npm ci

      - name: Lint (erreurs réelles — voir backend/.eslintrc.json)
        working-directory: backend
        run: npm run lint

  # ── 1b. Analyse — frontend ───────────────────────────────────────────
  analyze-frontend:
    name: "1. Analyse — frontend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build (sert aussi de vérification de compilation)
        working-directory: frontend
        run: npm run build

  # ── 2. Build & push des images Docker sur Docker Hub ────────────────
  build-and-push:
    name: "2. Build & push Docker Hub"
    needs: [analyze-backend, analyze-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata — backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Extract metadata — frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Verify images are pullable from Docker Hub
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
