services:
  db:
    image: mysql:8.0
    container_name: profixgabon-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-profixgabon_db}
      MYSQL_USER: ${DB_USER:-profixgabon_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-devpassword}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-devrootpassword}
    ports:
      # Host-side port bumped from the default 3306: on this machine, Docker
      # can't bind 0.0.0.0:3306 ("forbidden by its access permissions") even
      # with nothing else listening on it — a stuck Windows/Docker Desktop
      # network handle, not a real conflict. Not load-bearing for the app
      # itself (backend talks to `db:3306` over the internal Docker
      # network, see DB_HOST below) — only affects connecting an external
      # DB client (Workbench/DBeaver/mysql CLI) from the host, which should
      # now point at localhost:33060 instead.
      - "33060:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-devrootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: node:20-alpine
    container_name: profixgabon-backend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "64400:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      API_VERSION: v1
      API_PREFIX: /api
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-profixgabon_db}
      DB_USER: ${DB_USER:-profixgabon_user}
      DB_PASSWORD: ${DB_PASSWORD:-devpassword}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:64573
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: profixgabon-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "64573:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:64400/api/v1
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  dbdata:
  backend_node_modules:
  frontend_node_modules:

networks:
  default:
    name: profixgabon-network
    driver: bridge
